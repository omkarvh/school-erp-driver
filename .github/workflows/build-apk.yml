name: Build Driver APK

# Builds the driver app APK on GitHub's servers, pointed at the live backend.
# Download the finished APK from the run's "Artifacts" section.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  API_ORIGIN: https://educare.hiideals.com

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'   # driver builds cleanly on latest; 3.35.1 breaks its deps
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_ORIGIN=$API_ORIGIN

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
